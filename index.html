<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Expense book</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef1f0;--sf:#fff;--ink:#17201d;--mut:#62716b;--ln:#d2dbd7;--ac:#1f6f5c;--acink:#fff;--bad:#b3261e;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root{--bg:#121715;--sf:#1a211e;--ink:#e6ede9;--mut:#93a39b;--ln:#2c3631;--ac:#4fc3a1;--acink:#0b1411;--bad:#ff8a80}}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 Archivo,system-ui,sans-serif}
.wrap{max-width:560px;margin:0 auto;padding:16px 14px 60px}
h1{margin:0;font-size:26px;font-weight:800;letter-spacing:-.5px}
button{font:inherit;cursor:pointer}
.btn{border:1px solid var(--ln);background:var(--sf);color:var(--ink);font-weight:600;padding:10px 14px;border-radius:8px}
.btn.pri{background:var(--ac);border-color:var(--ac);color:var(--acink)}
header{display:flex;justify-content:space-between;align-items:center;gap:10px}
.who{color:var(--mut);font-size:12.5px;margin-top:2px}
.badge{display:inline-block;padding:1px 8px;border-radius:10px;background:var(--ac);color:var(--acink);font-weight:600;font-size:12px}
.center{text-align:center;padding:90px 10px}
.center p{color:var(--mut)}
.month{display:flex;align-items:center;justify-content:space-between;margin:18px 0 6px}
.month b{font-size:17px}
.month button{width:40px;height:40px;border:1px solid var(--ln);background:var(--sf);color:var(--ink);border-radius:8px;font-size:18px}
.total{font-size:40px;font-weight:800;letter-spacing:-1px;margin:4px 0 12px}
.cat{display:grid;grid-template-columns:78px 1fr 64px;gap:8px;align-items:center;font-size:13px;margin:5px 0}
.bar{height:10px;background:var(--ln);border-radius:5px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ac)}
.cat span:last-child{text-align:right}
form{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:18px 0;padding:12px;background:var(--sf);border:1px solid var(--ln);border-radius:10px}
form .full{grid-column:1/-1}
input,select{font:inherit;font-size:16px;padding:10px;border:1px solid var(--ln);border-radius:8px;background:var(--bg);color:var(--ink);min-width:0;width:100%;box-sizing:border-box}
input:focus,select:focus{outline:2px solid var(--ac)}
.item{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:11px 0;border-bottom:1px solid var(--ln)}
.item small{display:block;color:var(--mut)}
.item .amt{font-weight:600;white-space:nowrap}
.x{border:0;background:none;color:var(--bad);font-size:20px;padding:4px 8px}
.empty{color:var(--mut);padding:20px 0;text-align:center}
.err{color:var(--bad);font-size:13px;margin-top:8px}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getAuth,GoogleAuthProvider,signInWithPopup,signOut,onAuthStateChanged} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {getFirestore,collection,addDoc,deleteDoc,doc,onSnapshot,query,orderBy,serverTimestamp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

/* ====== EDIT THESE 3 THINGS ====== */
const firebaseConfig={apiKey:"PASTE",authDomain:"PASTE",projectId:"PASTE",appId:"PASTE"};
const OWNER="your.email@gmail.com";   // editor (lowercase)
const MOM="mom.email@gmail.com";      // read only (lowercase)
/* ================================= */

const CATS=["Food","Travel","Study","Fun","Shopping","Other"];
const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app);
const $app=document.getElementById("app");
let user=null,role=null,items=[],month=new Date().toISOString().slice(0,7),unsub=null,err="";

const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const inr=n=>"₹"+Math.round(n).toLocaleString("en-IN");
const shift=(m,d)=>{const [y,mo]=m.split("-").map(Number);const dt=new Date(y,mo-1+d,1);return dt.getFullYear()+"-"+String(dt.getMonth()+1).padStart(2,"0")};
const label=m=>{const [y,mo]=m.split("-").map(Number);return new Date(y,mo-1,1).toLocaleDateString("en-IN",{month:"long",year:"numeric"})};

onAuthStateChanged(auth,u=>{
  if(unsub){unsub();unsub=null}
  user=u;items=[];err="";
  const e=u&&u.emailVerified?(u.email||"").toLowerCase():"";
  role=e===OWNER?"edit":e===MOM?"view":null;
  if(role){
    unsub=onSnapshot(query(collection(db,"expenses"),orderBy("date","desc")),
      s=>{items=s.docs.map(d=>({id:d.id,...d.data()}));render()},
      x=>{err="Can’t load data: "+x.code;render()});
  }
  render();
});

function render(){
  if(!user){
    $app.innerHTML=`<div class="center"><h1>Expense book</h1><p>Private. Sign in with your Google account.</p><button class="btn pri" id="in">Sign in with Google</button></div>`;
    document.getElementById("in").onclick=()=>signInWithPopup(auth,new GoogleAuthProvider()).catch(x=>{err=x.code;render()});
    return;
  }
  if(!role){
    $app.innerHTML=`<div class="center"><h1>No access</h1><p>${esc(user.email)} isn’t allowed here.</p><button class="btn" id="out">Sign out</button></div>`;
    document.getElementById("out").onclick=()=>signOut(auth);
    return;
  }
  const list=items.filter(i=>i.date&&i.date.startsWith(month));
  const total=list.reduce((a,i)=>a+i.amount,0);
  const by={};list.forEach(i=>by[i.category]=(by[i.category]||0)+i.amount);
  const max=Math.max(1,...Object.values(by));
  const cats=Object.entries(by).sort((a,b)=>b[1]-a[1]).map(([c,v])=>`<div class="cat"><span>${esc(c)}</span><div class="bar"><i style="width:${v/max*100}%"></i></div><span>${inr(v)}</span></div>`).join("");
  const rows=list.map(i=>`<div class="item"><div>${esc(i.note||i.category)}<small>${esc(i.category)} · ${new Date(i.date+"T00:00").toLocaleDateString("en-IN",{day:"numeric",month:"short"})}</small></div><div><span class="amt">${inr(i.amount)}</span>${role==="edit"?`<button class="x" data-del="${i.id}" aria-label="Delete">×</button>`:""}</div></div>`).join("");
  const form=role==="edit"?`<form id="f"><input class="full" name="amount" type="number" inputmode="decimal" step="0.01" min="0.01" placeholder="Amount ₹" required>
<select name="category">${CATS.map(c=>`<option>${c}</option>`).join("")}</select><input name="date" type="date" value="${new Date().toLocaleDateString("en-CA")}" required>
<input class="full" name="note" placeholder="What for? (optional)" maxlength="80"><button class="btn pri full" type="submit">Add expense</button></form>`:"";
  $app.innerHTML=`<header><div><h1>Expense book</h1><div class="who"><span class="badge">${role==="edit"?"Editor":"Read only"}</span> ${esc(user.email)}</div></div><button class="btn" id="out">Sign out</button></header>
<div class="month"><button id="pv" aria-label="Previous month">‹</button><b>${label(month)}</b><button id="nx" aria-label="Next month">›</button></div>
<div class="total">${inr(total)}</div>${cats}${form}
${err?`<div class="err">${esc(err)}</div>`:""}
${rows||`<div class="empty">No expenses this month.</div>`}`;
  document.getElementById("out").onclick=()=>signOut(auth);
  document.getElementById("pv").onclick=()=>{month=shift(month,-1);render()};
  document.getElementById("nx").onclick=()=>{month=shift(month,1);render()};
  const f=document.getElementById("f");
  if(f)f.onsubmit=async e=>{
    e.preventDefault();const d=new FormData(f);
    try{await addDoc(collection(db,"expenses"),{amount:Number(d.get("amount")),category:d.get("category"),date:d.get("date"),note:d.get("note").trim(),by:user.email.toLowerCase(),createdAt:serverTimestamp()});err=""}
    catch(x){err="Save failed: "+x.code;render()}
  };
  document.querySelectorAll("[data-del]").forEach(b=>b.onclick=async()=>{
    if(!confirm("Delete this expense?"))return;
    try{await deleteDoc(doc(db,"expenses",b.dataset.del))}catch(x){err="Delete failed: "+x.code;render()}
  });
}
</script>
</body>
</html>
