<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Expense book</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef1f0;--sf:#fff;--ink:#17201d;--mut:#62716b;--ln:#d2dbd7;--ac:#1f6f5c;--acink:#fff;--bad:#b3261e;
padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root{--bg:#121715;--sf:#1a211e;--ink:#e6ede9;--mut:#93a39b;--ln:#2c3631;--ac:#4fc3a1;--acink:#0b1411;--bad:#ff8a80}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 Archivo,system-ui,sans-serif}
.wrap{max-width:560px;margin:0 auto;padding:16px 14px 60px}
h1{margin:0;font-size:26px;font-weight:800;letter-spacing:-.5px}
button{font:inherit;cursor:pointer}
.btn{border:1px solid var(--ln);background:var(--sf);color:var(--ink);font-weight:600;padding:10px 14px;border-radius:8px}
.btn.pri{background:var(--ac);border-color:var(--ac);color:var(--acink)}
.btn.sm{padding:5px 10px;font-size:13px}
.btn:disabled{opacity:.5;cursor:not-allowed}
header{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.who{color:var(--mut);font-size:12.5px;margin-top:3px}
.badge{display:inline-block;padding:1px 8px;border-radius:10px;background:var(--ac);color:var(--acink);font-weight:600;font-size:12px}
.badge.view{background:var(--ln);color:var(--ink)}
.center{text-align:center;padding:70px 10px}
.center p{color:var(--mut)}

/* Auth Form */
.auth-box{background:var(--sf);border:1px solid var(--ln);border-radius:12px;padding:24px 20px;max-width:380px;margin:24px auto 0;text-align:left}
.auth-box label{display:block;font-size:13px;font-weight:600;margin-bottom:6px;color:var(--mut)}
.auth-box input{margin-bottom:12px}

/* Dashboard */
.dash-actions{display:flex;gap:8px;margin:20px 0 16px}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:12px;padding:14px 16px;margin-bottom:10px;cursor:pointer;transition:border-color .15s,box-shadow .15s}
.card:hover{border-color:var(--ac);box-shadow:0 2px 8px rgba(0,0,0,.07)}
.card-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.card-name{font-weight:700;font-size:16px}
.card-sub{color:var(--mut);font-size:12.5px;margin-top:4px}

/* Reimb view */
.month{display:flex;align-items:center;justify-content:space-between;margin:18px 0 6px}
.month b{font-size:17px}
.month button{width:40px;height:40px;border:1px solid var(--ln);background:var(--sf);color:var(--ink);border-radius:8px;font-size:18px}
.total{font-size:40px;font-weight:800;letter-spacing:-1px;margin:4px 0 12px}
.cat{display:grid;grid-template-columns:78px 1fr 64px;gap:8px;align-items:center;font-size:13px;margin:5px 0}
.bar{height:10px;background:var(--ln);border-radius:5px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ac)}
.cat span:last-child{text-align:right}
form{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:18px 0;padding:12px;background:var(--sf);border:1px solid var(--ln);border-radius:10px}
form .full{grid-column:1/-1}
input,select{font:inherit;font-size:16px;padding:10px;border:1px solid var(--ln);border-radius:8px;background:var(--bg);color:var(--ink);min-width:0;width:100%}
input:focus,select:focus{outline:2px solid var(--ac)}
.item{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:11px 0;border-bottom:1px solid var(--ln)}
.item small{display:block;color:var(--mut)}
.item .amt{font-weight:600;white-space:nowrap}
.x{border:0;background:none;color:var(--bad);font-size:20px;padding:4px 8px}
.empty{color:var(--mut);padding:20px 0;text-align:center}
.err{color:var(--bad);font-size:13px;margin-top:8px;padding:8px;background:rgba(179,38,30,.08);border-radius:6px}
.info{color:var(--ac);font-size:13px;margin-top:8px;padding:8px;background:rgba(31,111,92,.1);border-radius:6px}

/* Token share box */
.token-box{background:var(--sf);border:1px solid var(--ln);border-radius:10px;padding:14px 16px;margin:14px 0}
.token-label{font-size:12.5px;color:var(--mut);margin-bottom:8px}
.token-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
code{font-size:22px;font-weight:800;letter-spacing:3px;background:var(--bg);padding:7px 14px;border-radius:8px;border:1px solid var(--ln);flex:1}

/* Bottom sheet modal */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center;z-index:100;animation:fadeIn .15s}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.sheet{background:var(--sf);border-radius:16px 16px 0 0;padding:24px 20px 32px;width:100%;max-width:560px;display:flex;flex-direction:column;gap:12px;animation:slideUp .2s}
@keyframes slideUp{from{transform:translateY(60px);opacity:0}to{transform:none;opacity:1}}
.sheet h2{margin:0;font-size:18px}
.sheet-input{font:inherit;font-size:16px;padding:12px;border:1px solid var(--ln);border-radius:8px;background:var(--bg);color:var(--ink);width:100%}
.sheet-input:focus{outline:2px solid var(--ac)}
.sheet-actions{display:flex;gap:8px}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<div id="modal"></div>

<script>
const $app = document.getElementById("app");
const $modal = document.getElementById("modal");

const CATS = ["Food","Travel","Study","Fun","Shopping","Other"];

// ── App State (Pure Postgres + JWT) ──
let currentUser = JSON.parse(localStorage.getItem("reimb_user") || "null");
let authToken = localStorage.getItem("reimb_token") || null;
let screen = "dash";
let authStep = "email"; // 'email' or 'otp'
let tempEmail = "";

let reimbsList = [];
let currentReimb = null, items = [];
let month = new Date().toISOString().slice(0,7);
let loading = false;

// ── Helpers ──
const esc = s => String(s || "").replace(/[&<>"']/g, c =>
  ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const inr = n => "₹" + Math.round(Number(n)).toLocaleString("en-IN");
const shift = (m,d) => { const [y,mo] = m.split("-").map(Number);
  const dt = new Date(y, mo-1+d, 1);
  return dt.getFullYear()+"-"+String(dt.getMonth()+1).padStart(2,"0"); };
const label = m => { const [y,mo] = m.split("-").map(Number);
  return new Date(y,mo-1,1).toLocaleDateString("en-IN",{month:"long",year:"numeric"}); };

// API Fetch Helper
async function api(path, options = {}) {
  const headers = {
    'Content-Type': 'application/json',
    ...(authToken ? { 'Authorization': `Bearer ${authToken}` } : {}),
    ...(options.headers || {})
  };

  const res = await fetch(path, { ...options, headers });
  const data = await res.json().catch(() => ({}));

  if (res.status === 401) {
    // Session expired
    signOut();
    throw new Error("Session expired. Please log in again.");
  }

  if (!res.ok) {
    throw new Error(data.error || `HTTP error ${res.status}`);
  }
  return data;
}

function signOut() {
  localStorage.removeItem("reimb_token");
  localStorage.removeItem("reimb_user");
  currentUser = null;
  authToken = null;
  currentReimb = null;
  reimbsList = [];
  authStep = "email";
  render();
}

// ── Data Loading ──
async function loadDashboard() {
  if (!currentUser) return;
  loading = true; render();
  try {
    reimbsList = await api('/api/reimbs');
  } catch (err) {
    showErr(err.message);
  } finally {
    loading = false; render();
  }
}

async function createReimb(name) {
  const r = await api('/api/reimbs', {
    method: 'POST',
    body: JSON.stringify({ name })
  });
  reimbsList = [r, ...reimbsList];
  await openReimb(r);
}

async function joinWithToken(raw) {
  const r = await api('/api/reimbs/join', {
    method: 'POST',
    body: JSON.stringify({ token: raw })
  });
  if (!reimbsList.some(item => item.id === r.id)) {
    reimbsList = [r, ...reimbsList];
  }
  await openReimb(r);
}

async function openReimb(r) {
  currentReimb = r; screen = "reimb";
  month = new Date().toISOString().slice(0,7);
  render();
  await loadExpenses();
}

async function loadExpenses() {
  if (!currentReimb) return;
  try {
    items = await api(`/api/reimbs/${currentReimb.id}/expenses`);
  } catch (err) {
    showErr("Can't load expenses: " + err.message);
  }
  render();
}

function goBack() {
  currentReimb = null; items = []; screen = "dash"; render();
}

// ── Render Views ──
function render() {
  if (!currentUser)                     { renderLogin(); return; }
  if (screen==="reimb" && currentReimb) { renderReimb(); return; }
  renderDash();
}

function renderLogin() {
  if (authStep === "email") {
    $app.innerHTML = `
      <div class="center">
        <h1>Expense book</h1>
        <p>Pure PostgreSQL expense tracker. Access from any device.</p>
        <div class="auth-box">
          <label>Your Email Address</label>
          <input id="loginEmail" type="email" placeholder="e.g. name@example.com" value="${esc(tempEmail)}">
          <button class="btn pri full" id="sendOtpBtn" style="width:100%">Get Login Code</button>
          <div id="loginMsg"></div>
        </div>
      </div>`;

    document.getElementById("sendOtpBtn").onclick = async () => {
      const email = document.getElementById("loginEmail").value.trim();
      const msg = document.getElementById("loginMsg");
      if (!email || !email.includes("@")) {
        msg.innerHTML = `<div class="err">Please enter a valid email address.</div>`;
        return;
      }
      msg.innerHTML = `<div class="info">Generating code...</div>`;
      try {
        const res = await api('/api/auth/send-otp', {
          method: 'POST',
          body: JSON.stringify({ email })
        });
        tempEmail = email;
        authStep = "otp";
        render();
        // Show the code directly in helper box for convenience
        setTimeout(() => {
          showErr(`Your login code is: ${res.code}`);
        }, 500);
      } catch (err) {
        msg.innerHTML = `<div class="err">${esc(err.message)}</div>`;
      }
    };
  } else {
    $app.innerHTML = `
      <div class="center">
        <h1>Enter Login Code</h1>
        <p>Code sent for <b>${esc(tempEmail)}</b></p>
        <div class="auth-box">
          <label>6-Digit Code</label>
          <input id="otpCode" type="text" maxlength="6" inputmode="numeric" placeholder="123456" autofocus>
          <button class="btn pri full" id="verifyOtpBtn" style="width:100%">Sign In</button>
          <button class="btn sm" id="backToEmail" style="width:100%;margin-top:8px">Use different email</button>
          <div id="loginMsg"></div>
        </div>
      </div>`;

    document.getElementById("backToEmail").onclick = () => {
      authStep = "email"; render();
    };

    document.getElementById("verifyOtpBtn").onclick = async () => {
      const code = document.getElementById("otpCode").value.trim();
      const msg = document.getElementById("loginMsg");
      if (!code || code.length < 4) {
        msg.innerHTML = `<div class="err">Please enter the 6-digit code.</div>`;
        return;
      }
      msg.innerHTML = `<div class="info">Verifying...</div>`;
      try {
        const res = await api('/api/auth/verify-otp', {
          method: 'POST',
          body: JSON.stringify({ email: tempEmail, code })
        });
        authToken = res.token;
        currentUser = res.user;
        localStorage.setItem("reimb_token", authToken);
        localStorage.setItem("reimb_user", JSON.stringify(currentUser));
        authStep = "email";
        tempEmail = "";
        await loadDashboard();
      } catch (err) {
        msg.innerHTML = `<div class="err">${esc(err.message)}</div>`;
      }
    };
  }
}

function renderDash() {
  const cards = reimbsList.map(r => `
    <div class="card" data-id="${r.id}">
      <div class="card-top">
        <span class="card-name">${esc(r.name)}</span>
        <span class="badge${r.role==="viewer"?" view":""}">${r.role==="owner"?"Owner":"Viewer"}</span>
      </div>
      <div class="card-sub">${esc(r.owner_email)}</div>
    </div>`).join("");

  $app.innerHTML = `
    <header>
      <div><h1>Expense book</h1><div class="who">${esc(currentUser.email)}</div></div>
      <button class="btn" id="out">Sign out</button>
    </header>
    <div class="dash-actions">
      <button class="btn pri" id="newR">＋ New reimb</button>
      <button class="btn" id="joinR">🔑 Join with token</button>
    </div>
    ${loading
      ? `<div class="empty">Loading…</div>`
      : cards || `<div class="empty">No reimbs yet.<br>Create one or join with a token!</div>`}`;

  document.getElementById("out").onclick = signOut;
  document.getElementById("newR").onclick = () => showSheet("new");
  document.getElementById("joinR").onclick = () => showSheet("join");
  document.querySelectorAll(".card").forEach(c => c.onclick = () => {
    const r = reimbsList.find(r => String(r.id) === String(c.dataset.id));
    if (r) openReimb(r);
  });
}

function renderReimb() {
  const r = currentReimb, isOwner = r.role === "owner";
  const list = items.filter(i => i.date && i.date.startsWith(month));
  const total = list.reduce((a,i) => a + Number(i.amount), 0);
  const by = {}; list.forEach(i => by[i.category] = (by[i.category] || 0) + Number(i.amount));
  const max = Math.max(1, ...Object.values(by));
  const cats = Object.entries(by).sort((a,b)=>b[1]-a[1])
    .map(([c,v]) => `<div class="cat"><span>${esc(c)}</span>
      <div class="bar"><i style="width:${v/max*100}%"></i></div>
      <span>${inr(v)}</span></div>`).join("");

  const rows = list.map(i => `
    <div class="item">
      <div>${esc(i.note||i.category)}
        <small>${esc(i.category)} · ${new Date(i.date+"T00:00")
          .toLocaleDateString("en-IN",{day:"numeric",month:"short"})}</small>
      </div>
      <div><span class="amt">${inr(i.amount)}</span>
        ${isOwner ? `<button class="x" data-del="${i.id}">×</button>` : ""}
      </div>
    </div>`).join("");

  const form = isOwner ? `
    <form id="f">
      <input class="full" name="amount" type="number" inputmode="decimal"
        step="0.01" min="0.01" placeholder="Amount ₹" required>
      <select name="category">${CATS.map(c=>`<option>${c}</option>`).join("")}</select>
      <input name="date" type="date" value="${new Date().toLocaleDateString("en-CA")}" required>
      <input class="full" name="note" placeholder="What for? (optional)" maxlength="80">
      <button class="btn pri full" type="submit">Add expense</button>
    </form>` : "";

  const tokenBox = isOwner ? `
    <div class="token-box">
      <div class="token-label">Share this token with others for viewer access:</div>
      <div class="token-row">
        <code>${r.token}</code>
        <button class="btn sm" id="cpTok">Copy</button>
      </div>
    </div>` : "";

  $app.innerHTML = `
    <header>
      <div>
        <button class="btn" id="back">‹ Back</button>
        <h1 style="margin-top:8px">${esc(r.name)}</h1>
        <div class="who">
          <span class="badge${r.role==="viewer"?" view":""}">${isOwner?"Owner":"Viewer"}</span>
          ${esc(r.owner_email)}
        </div>
      </div>
      <button class="btn" id="out">Sign out</button>
    </header>
    ${tokenBox}
    <div class="month">
      <button id="pv">‹</button><b>${label(month)}</b><button id="nx">›</button>
    </div>
    <div class="total">${inr(total)}</div>
    ${cats}${form}
    ${rows || `<div class="empty">No expenses this month.</div>`}`;

  document.getElementById("back").onclick = goBack;
  document.getElementById("out").onclick = signOut;
  document.getElementById("pv").onclick = () => { month=shift(month,-1); render(); };
  document.getElementById("nx").onclick = () => { month=shift(month, 1); render(); };

  if (isOwner) {
    document.getElementById("cpTok").onclick = () => {
      navigator.clipboard.writeText(r.token).then(() => {
        const b = document.getElementById("cpTok");
        if (b) { b.textContent="Copied!"; setTimeout(()=>{ const b2=document.getElementById("cpTok"); if(b2)b2.textContent="Copy"; },2000); }
      });
    };

    const f = document.getElementById("f");
    if (f) f.onsubmit = async e => {
      e.preventDefault();
      const d = new FormData(f);
      try {
        const added = await api(`/api/reimbs/${r.id}/expenses`, {
          method: 'POST',
          body: JSON.stringify({
            amount: Number(d.get("amount")),
            category: d.get("category"),
            date: d.get("date"),
            note: d.get("note").trim()
          })
        });
        items.unshift(added);
        f.reset();
        f.date.value = new Date().toLocaleDateString("en-CA");
        render();
      } catch(x) { showErr("Save failed: " + x.message); }
    };
  }

  document.querySelectorAll("[data-del]").forEach(b => b.onclick = async () => {
    if (!confirm("Delete this expense?")) return;
    try {
      await api(`/api/expenses/${b.dataset.del}`, { method: 'DELETE' });
      items = items.filter(it => String(it.id) !== String(b.dataset.del));
      render();
    } catch(x) { showErr("Delete failed: " + x.message); }
  });
}

// ── Modal Sheet ──
function showSheet(type) {
  const isNew = type === "new";
  $modal.innerHTML = `
    <div class="overlay" id="ov">
      <div class="sheet">
        <h2>${isNew ? "Create a new reimb" : "Join with a token"}</h2>
        <input id="shInp" class="sheet-input"
          placeholder="${isNew
            ? "Name it (e.g. Trip to Goa, Monthly expenses)"
            : "Enter token (e.g. ABCD-1234)"}" autocomplete="off">
        <div id="shErr"></div>
        <div class="sheet-actions">
          <button class="btn pri" id="shOk">${isNew ? "Create" : "Join"}</button>
          <button class="btn" id="shX">Cancel</button>
        </div>
      </div>
    </div>`;

  const inp = document.getElementById("shInp");
  const btn = document.getElementById("shOk");
  const errEl = document.getElementById("shErr");
  inp.focus();

  const close = () => { $modal.innerHTML = ""; };
  document.getElementById("shX").onclick = close;
  document.getElementById("ov").onclick = e => { if(e.target.id==="ov") close(); };

  inp.onkeydown = e => { if(e.key==="Enter") btn.click(); };

  btn.onclick = async () => {
    const val = inp.value.trim();
    if (!val) { inp.focus(); return; }
    btn.disabled = true;
    btn.textContent = isNew ? "Creating…" : "Joining…";
    errEl.innerHTML = "";
    try {
      if (isNew) await createReimb(val);
      else await joinWithToken(val);
      close();
    } catch(e) {
      errEl.innerHTML = `<div class="err">${esc(e.message)}</div>`;
      btn.disabled = false;
      btn.textContent = isNew ? "Create" : "Join";
    }
  };
}

function showErr(msg) {
  let el = document.getElementById("globalErr");
  if (!el) {
    el = document.createElement("div");
    el.id = "globalErr";
    el.style.cssText = "position:fixed;top:12px;left:50%;transform:translateX(-50%);background:var(--bad);color:#fff;padding:10px 18px;border-radius:8px;font-size:14px;z-index:200;max-width:90vw;text-align:center";
    document.body.appendChild(el);
  }
  el.textContent = msg;
  clearTimeout(el._t);
  el._t = setTimeout(() => el.remove(), 4000);
}

// Initial boot
if (currentUser && authToken) {
  loadDashboard();
} else {
  render();
}
</script>
</body>
</html>
